<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizSpeak AI - 실무 컨콜 기반 비즈니스 영어 회화 (Inzmo UI)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       BizSpeak AI - Inzmo Behance Visual Design System (Pure Vanilla CSS)
       ========================================================================== */
    :root {
      --bg-obsidian: #080b12;
      --bg-card: rgba(18, 26, 42, 0.75);
      --bg-card-hover: rgba(26, 37, 59, 0.85);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-glow: rgba(0, 245, 155, 0.5);
      --border-glass-cyan: rgba(0, 216, 246, 0.4);
      --accent-mint: #00F59B;
      --accent-mint-glow: rgba(0, 245, 155, 0.25);
      --accent-cyan: #00D8F6;
      --accent-violet: #6366F1;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --font-display: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-glass: 0 20px 50px rgba(0, 0, 0, 0.6);
      --glow-mint: 0 0 25px rgba(0, 245, 155, 0.35);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(0, 245, 155, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 50% 85%, rgba(0, 216, 246, 0.1) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .app-container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    header {
      padding: 24px 0 16px 0; border-bottom: 1px solid var(--border-glass); margin-bottom: 32px;
    }
    .header-content { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .brand-box { display: flex; align-items: center; gap: 16px; }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-mint) 0%, var(--accent-cyan) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--glow-mint); color: #080b12; font-weight: 800; font-size: 1.4rem;
    }

    .inzmo-glass-card {
      background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); border-radius: var(--radius-lg); box-shadow: var(--shadow-glass);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .inzmo-glass-card.interactive:hover {
      transform: translateY(-4px); border-color: var(--border-glass-glow); box-shadow: 0 25px 60px rgba(0,0,0,0.7), var(--glow-mint);
    }

    h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.02em; }
    .gradient-mint { background: linear-gradient(135deg, #FFFFFF 20%, var(--accent-mint) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-cyan { background: linear-gradient(135deg, #FFFFFF 20%, var(--accent-cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-violet { background: linear-gradient(135deg, #FFFFFF 20%, #C084FC 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .inzmo-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
      border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); color: var(--text-muted);
    }
    .inzmo-pill.mint { background: rgba(0, 245, 155, 0.1); border-color: rgba(0, 245, 155, 0.3); color: var(--accent-mint); }
    .inzmo-pill.cyan { background: rgba(0, 216, 246, 0.1); border-color: rgba(0, 216, 246, 0.3); color: var(--accent-cyan); }
    .inzmo-pill.violet { background: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.35); color: #A5B4FC; }

    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent-mint);
      box-shadow: 0 0 10px var(--accent-mint); animation: pulse-ring 1.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(0, 245, 155, 0.8); }
      70% { box-shadow: 0 0 0 10px rgba(0, 245, 155, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 245, 155, 0); }
    }

    .inzmo-stat-card { padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
    .inzmo-stat-value { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: #FFF; margin-top: 8px; }

    .inzmo-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border-radius: var(--radius-md); font-family: var(--font-display);
      font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; outline: none; transition: all 0.25s ease;
    }
    .inzmo-btn-primary { background: linear-gradient(135deg, var(--accent-mint) 0%, #00C87E 100%); color: #04120C; box-shadow: 0 8px 24px rgba(0, 245, 155, 0.3); }
    .inzmo-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0, 245, 155, 0.45); }
    .inzmo-btn-secondary { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-glass); color: var(--text-main); }
    .inzmo-btn-secondary:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }

    .voice-mic-btn {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-mint) 0%, var(--accent-cyan) 100%);
      border: none; color: #080b12; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 0 35px var(--accent-mint-glow); transition: all 0.3s ease; font-size: 2rem;
    }
    .voice-mic-btn.recording {
      background: linear-gradient(135deg, #FF477E 0%, #FF0044 100%);
      box-shadow: 0 0 45px rgba(255, 0, 68, 0.5); animation: mic-pulse 1.4s infinite;
    }
    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 71, 126, 0.6); }
      70% { box-shadow: 0 0 0 24px rgba(255, 71, 126, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 71, 126, 0); }
    }

    .visualizer-canvas { width: 100%; height: 90px; border-radius: var(--radius-md); background: rgba(10, 14, 22, 0.8); border: 1px solid var(--border-glass); }

    .comparison-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; margin-top: 12px; }
    @media (max-width: 768px) { .comparison-grid { grid-template-columns: 1fr; } }
    .comparison-box { padding: 16px; border-radius: var(--radius-md); font-size: 0.92rem; }
    .comparison-box.direct { background: rgba(255, 94, 126, 0.08); border: 1px solid rgba(255, 94, 126, 0.25); color: #FFB3C1; }
    .comparison-box.native { background: rgba(0, 245, 155, 0.08); border: 1px solid rgba(0, 245, 155, 0.3); color: #D1FAE5; }

    .inzmo-input, .inzmo-textarea {
      width: 100%; background: rgba(13, 18, 31, 0.8); border: 1px solid var(--border-glass);
      border-radius: var(--radius-md); padding: 14px 18px; color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    .inzmo-input:focus, .inzmo-textarea:focus {
      border-color: var(--accent-mint); box-shadow: 0 0 0 3px var(--accent-mint-glow);
    }

    .inzmo-tab-bar {
      display: flex; gap: 6px; background: rgba(13, 18, 31, 0.9); padding: 6px;
      border-radius: var(--radius-full); border: 1px solid var(--border-glass); overflow-x: auto;
    }
    .inzmo-tab-btn {
      display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--radius-full);
      border: none; background: transparent; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .inzmo-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 245, 155, 0.15) 0%, rgba(0, 216, 246, 0.15) 100%);
      border: 1px solid var(--border-glass-glow); color: var(--accent-mint); box-shadow: var(--glow-mint);
    }

    .dropzone-box {
      border: 2px dashed var(--accent-mint);
      border-radius: var(--radius-md);
      padding: 28px 20px;
      text-align: center;
      background: rgba(13, 18, 31, 0.7);
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 16px;
    }
    .dropzone-box:hover, .dropzone-box.drag-active {
      border-color: #00F59B;
      background: rgba(0, 245, 155, 0.12);
      box-shadow: 0 0 25px rgba(0, 245, 155, 0.35);
      transform: scale(1.01);
    }

    .archive-scroll-container {
      max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-right: 6px; margin-top: 10px;
    }
    .archive-item {
      padding: 12px 16px; border-radius: 12px; background: rgba(13, 18, 31, 0.7);
      border: 1px solid var(--border-glass); cursor: pointer; transition: all 0.2s ease;
      display: flex; justify-content: space-between; align-items: center;
    }
    .archive-item:hover, .archive-item.active {
      border-color: var(--border-glass-glow); background: rgba(0, 245, 155, 0.08);
    }

    .shadowing-score-box {
      margin-top: 20px; padding: 20px; border-radius: 16px;
      background: rgba(10, 14, 24, 0.9); border: 1px solid var(--border-glass-glow);
      text-align: left; animation: fadeIn 0.3s ease;
    }

    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
      background: rgba(8, 11, 18, 0.85); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }

    .toast-box {
      position: fixed; top: 24px; right: 24px; z-index: 99999;
      background: rgba(0, 245, 155, 0.95); color: #080b12;
      padding: 12px 24px; border-radius: var(--radius-md); font-weight: 700;
      box-shadow: var(--glow-mint); display: none;
    }
  </style>
</head>
<body>

  <div id="app"></div>
  <div id="toast" class="toast-box"></div>
  <div id="modalContainer"></div>

  <script>
    const DEFAULT_PRESET = {
      id: "preset-default",
      title: "Global IT Sprint Review & Milestone Delay Negotiation",
      category: "Technical Project Management",
      date: "2026-07-28 14:00",
      rawContent: `David: Good morning team. Let's get right down to business. We need to touch base on the API integration timeline.
Minsoo: Thanks David. Before we dive into the details, I want to clarify our position. We ran into an unexpected blocker regarding legacy authentication.
Sarah: Right. From a QA standpoint, pushing to production this Friday would be cutting it close. We haven't finished regression testing.
David: I hear you, but the client is expecting a hard deliverable by Friday. Is there any workaround we can leverage to meet the deadline?
Minsoo: To be completely transparent, if we rush this deployment, we risk introducing critical vulnerabilities. I strongly recommend pushing the release back by three business days.
David: That's a fair point. Let's align on a revised roadmap. Can you send out a updated action item list by end of day?
Minsoo: Absolutely. I'll circle back with the engineering team and share the mitigation plan shortly.`,
      extractedExpressions: [
        {
          phrase: "Get right down to business",
          directKorean: "바로 사업으로 가다",
          nativePolish: "사설 없이 즉시 본론으로 들어가다",
          category: "Meeting Opening",
          frequency: "High (94%)",
          contextInCall: "David used this at call start to transition quickly into the core agenda.",
          exampleSentence: "Since everyone is here, let's get right down to business."
        },
        {
          phrase: "Touch base on",
          directKorean: "베이스를 터치하다",
          nativePolish: "~에 대해 간략히 상황을 점검/공유하다",
          category: "Status Update",
          frequency: "Very High (98%)",
          contextInCall: "David introduced the API integration topic.",
          exampleSentence: "I just wanted to touch base on the Q3 budget proposals."
        },
        {
          phrase: "Cutting it close",
          directKorean: "가깝게 자르다",
          nativePolish: "일정이 아슬아슬하다 / 시간이 매우 타이트하다",
          category: "Risk & Timeline",
          frequency: "High (89%)",
          contextInCall: "Sarah warned that releasing on Friday leaves almost zero buffer time.",
          exampleSentence: "Releasing this Friday is definitely cutting it close."
        },
        {
          phrase: "To be completely transparent",
          directKorean: "완전히 투명해지자면",
          nativePolish: "솔직히 말씀드리면 / 우려사항을 밝히자면",
          category: "Negotiation & Honesty",
          frequency: "High (91%)",
          contextInCall: "Minsoo introduced the bad news regarding the release delay.",
          exampleSentence: "To be completely transparent, our current bandwidth is stretched."
        },
        {
          phrase: "Circle back with",
          directKorean: "원으로 돌아오다",
          nativePolish: "~와 재논의 후 다시 업데이트드리다",
          category: "Action Items & Wrap-up",
          frequency: "Very High (96%)",
          contextInCall: "Minsoo promised to consult developers and follow up.",
          exampleSentence: "Let me circle back with my team and get back to you by EOD."
        }
      ]
    };

    const savedArchives = JSON.parse(localStorage.getItem('bizspeak_archives') || 'null') || [DEFAULT_PRESET];

    const state = {
      activeTab: 'analyzer',
      savedExpressions: JSON.parse(localStorage.getItem('bizspeak_saved') || 'null') || DEFAULT_PRESET.extractedExpressions,
      apiKey: localStorage.getItem('bizspeak_api_key') || '',
      archivedTranscripts: savedArchives,
      activeArchiveId: savedArchives[0] ? savedArchives[0].id : null,
      messages: [
        { id: 1, sender: 'ai', text: "Good morning team! Let's touch base on the API integration timeline. Where do we currently stand?" }
      ],
      isRecording: false,
      isAiSpeaking: false,
      isModalOpen: false,
      customTitle: '',
      customText: '',
      currentExpressions: savedArchives[0] ? savedArchives[0].extractedExpressions : DEFAULT_PRESET.extractedExpressions,
      drillSourceMode: 'current',
      drillIndex: 0,
      
      // SPEAK Shadowing State
      isShadowingActive: false,
      isShadowingListening: false,
      userShadowingSpoken: '',
      shadowingScore: null,
      shadowingFeedback: '',

      // SPEAK Dynamic Coach Report
      currentCoachReport: {
        corrected: "Good morning David. Let me touch base on our sprint status.",
        tip: "💡 Coach Tip: 회의 시작 시 단순 인사 후 'touch base on'을 붙이면 전문적인 어조가 완성됩니다."
      }
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
      recognition.continuous = false;
      recognition.lang = 'en-US';
    }

    function speakText(text, onEnd) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      if (onEnd) u.onend = onEnd;
      window.speechSynthesis.speak(u);
    }

    let visualizerAnimId = null;
    function startWaveform(canvas, isAnimating) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let phase = 0;

      const render = () => {
        const width = canvas.width = canvas.parentElement ? canvas.parentElement.clientWidth : 300;
        const height = canvas.height = 90;
        ctx.clearRect(0, 0, width, height);
        ctx.lineWidth = 3;
        ctx.strokeStyle = state.isRecording ? '#FF477E' : '#00F59B';
        ctx.beginPath();

        const bars = 32;
        const barW = width / bars;
        for (let i = 0; i < bars; i++) {
          const x = i * barW + barW / 2;
          let amp = isAnimating ? Math.sin(phase + i * 0.4) * 26 + 12 : 6;
          ctx.moveTo(x, (height / 2) - amp);
          ctx.lineTo(x, (height / 2) + amp);
        }
        ctx.stroke();
        phase += 0.15;
        if (isAnimating) visualizerAnimId = requestAnimationFrame(render);
      };
      if (visualizerAnimId) cancelAnimationFrame(visualizerAnimId);
      render();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function saveArchivesToStorage() {
      localStorage.setItem('bizspeak_archives', JSON.stringify(state.archivedTranscripts));
    }

    function saveState() {
      localStorage.setItem('bizspeak_saved', JSON.stringify(state.savedExpressions));
    }

    function cleanKoreanMeaning(rawMeaning) {
      if (!rawMeaning) return '';
      return rawMeaning
        .replace(/^녹취록 발화 문맥:\s*/i, '')
        .replace(/^문맥:\s*/i, '')
        .replace(/^"|"$/g, '')
        .trim();
    }

    function extractExpressionsFromCustomText(text) {
      if (!text || !text.trim()) return [];

      const extracted = [];
      const lowerText = text.toLowerCase();

      const DICTIONARY = [
        { keywords: ["start right now", "start now", "get started", "let's start"], phrase: "Get started right away", direct: "바로 시작하다", native: "사설 없이 회의/업무를 즉시 개시하다", cat: "Meeting Opening", example: "Let's get started right away with the main agenda." },
        { keywords: ["touch base"], phrase: "Touch base on", direct: "베이스를 터치하다", native: "~에 대해 간략히 상황을 점검/공유하다", cat: "Status Update", example: "Let's touch base on the API timeline next week." },
        { keywords: ["get down to business"], phrase: "Get right down to business", direct: "바로 사업으로 가다", native: "즉시 본론으로 들어 가다", cat: "Meeting Opening", example: "Let's get right down to business." },
        { keywords: ["cutting it close"], phrase: "Cutting it close", direct: "가깝게 자르다", native: "일정이 아슬아슬하다 / 시간이 매우 타이트하다", cat: "Risk & Timeline", example: "Releasing this Friday is definitely cutting it close." },
        { keywords: ["transparent"], phrase: "To be completely transparent", direct: "완전히 투명해지자면", native: "솔직히 상황을 밝히자면 (외교적 어조)", cat: "Negotiation", example: "To be completely transparent, our bandwidth is limited." },
        { keywords: ["circle back"], phrase: "Circle back with", direct: "원으로 돌아오다", native: "~와 재논의 후 다시 업데이트를 드리다", cat: "Wrap-up", example: "I'll circle back with the engineering team by EOD." },
        { keywords: ["align"], phrase: "Align on the roadmap", direct: "로드맵에 맞추다", native: "목표/방향성에 대해 상호 동의를 도출하다", cat: "Agreement", example: "We need to align on the project deliverables." },
        { keywords: ["workaround"], phrase: "Leverage a workaround", direct: "우회책을 지치다", native: "임시 대안/해결책을 활용하다", cat: "Problem Solving", example: "Is there any workaround we can leverage?" },
        { keywords: ["deliverable"], phrase: "Hard deliverable", direct: "단단한 인도물", native: "기한 내 반드시 제출해야 하는 성과물", cat: "Project Management", example: "The client is expecting a hard deliverable by Friday." }
      ];

      DICTIONARY.forEach(item => {
        if (item.keywords.some(kw => lowerText.includes(kw))) {
          extracted.push({
            phrase: item.phrase,
            directKorean: item.direct,
            nativePolish: item.native,
            category: item.cat,
            frequency: "High (94%)",
            exampleSentence: item.example
          });
        }
      });

      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const englishPhrases = [];

      lines.forEach(line => {
        const cleaned = line
          .replace(/참석자\s*\d+\s*\d{1,2}:\d{2}/gi, '')
          .replace(/^\d{4}\.\d{1,2}\.\d{1,2}.*/g, '')
          .replace(/^[A-Za-z0-9\s_-]+:\s*/, '')
          .trim();

        const engMatches = cleaned.match(/([A-Za-z0-9\s,'.?!-]{6,})/g);
        if (engMatches) {
          engMatches.forEach(m => {
            const trimmed = m.trim();
            const words = trimmed.split(/\s+/);
            if (words.length >= 3) {
              englishPhrases.push(trimmed);
            }
          });
        }
      });

      englishPhrases.forEach((sent, idx) => {
        if (extracted.length >= 5) return;
        const words = sent.split(/\s+/);
        const corePhrase = words.slice(0, Math.min(5, words.length)).join(' ');
        
        if (!extracted.some(e => e.phrase.toLowerCase() === corePhrase.toLowerCase())) {
          extracted.push({
            phrase: corePhrase.charAt(0).toUpperCase() + corePhrase.slice(1),
            directKorean: `"${corePhrase}" 직역`,
            nativePolish: `"${sent}"`,
            category: idx === 0 ? "Meeting Opening" : (idx % 2 === 0 ? "Status Update" : "Action Items"),
            frequency: "Extracted (96%)",
            exampleSentence: sent
          });
        }
      });

      if (extracted.length === 0) {
        extracted.push({
          phrase: "Get started right away",
          directKorean: "바로 시작하다",
          nativePolish: "사설 없이 즉시 본론으로 들어가다",
          category: "Meeting Opening",
          frequency: "High (94%)",
          exampleSentence: "Let's get started right away."
        });
      }

      return extracted;
    }

    function getDrillExpressionList() {
      if (state.drillSourceMode === 'saved') {
        return state.savedExpressions.length > 0 ? state.savedExpressions : DEFAULT_PRESET.extractedExpressions;
      }
      if (state.drillSourceMode === 'all') {
        const allExp = [];
        state.archivedTranscripts.forEach(arch => {
          if (arch.extractedExpressions) {
            arch.extractedExpressions.forEach(exp => {
              if (!allExp.some(e => e.phrase === exp.phrase)) allExp.push(exp);
            });
          }
        });
        return allExp.length > 0 ? allExp : state.currentExpressions;
      }
      return state.currentExpressions.length > 0 ? state.currentExpressions : DEFAULT_PRESET.extractedExpressions;
    }

    function evaluateShadowingSpeech(userSpoken, targetText) {
      const cleanSpoken = userSpoken.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);
      const cleanTarget = targetText.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);

      if (cleanTarget.length === 0) return { score: 100, feedback: "Perfect!" };

      let matchCount = 0;
      cleanTarget.forEach(w => {
        if (cleanSpoken.includes(w)) matchCount++;
      });

      const ratio = matchCount / cleanTarget.length;
      let score = Math.round(ratio * 100);
      if (score > 100) score = 100;
      if (cleanSpoken.length >= cleanTarget.length * 0.8 && score < 70) score = Math.min(85, score + 20);

      let feedback = "";
      if (score >= 90) {
        feedback = "💯 Perfect! 원어민 어조와 발음이 완벽하게 일치합니다!";
      } else if (score >= 70) {
        feedback = "👏 Great Job! 아주 훌륭한 섀도잉 발화입니다! 문장 강세를 조금만 더 살려보세요.";
      } else if (score >= 40) {
        feedback = "👍 Good Attempt! 문장의 핵심 키워드가 잘 전달되었습니다. 다시 한번 도전해보세요!";
      } else {
        feedback = "💪 Keep Trying! '1. 원어민 발음 듣기' 버튼으로 다시 한번 들어보고 천천히 따라해보세요.";
      }

      return { score, feedback };
    }

    // Dynamic Multi-Turn Business AI Roleplay & Realtime Grammar Coach Engine
    function generateSmartAiResponse(userText, messagesHistory) {
      const lower = userText.toLowerCase();

      // 1. Live Grammar & Expression Correction Coach Engine
      let correctionData = {
        corrected: userText,
        tip: "💡 Coach Tip: 세련된 비즈니스 어조입니다. 대화를 계속 진행하세요."
      };

      if (lower.includes("post it") || lower.includes("posted")) {
        correctionData.corrected = "Yes, I'll keep you posted on the mitigation plan.";
        correctionData.tip = "💡 Coach Tip: 'keep you post it' ➔ 'keep you posted' ('경과를 지속 공유드리겠다'는 올바른 비즈니스 관용 표현입니다).";
      } else if (lower.includes("hello") || lower.includes("hi") || lower.includes("good morning")) {
        correctionData.corrected = "Good morning David. Let's touch base on the API integration timeline.";
        correctionData.tip = "💡 Coach Tip: 단순 인사 후 바로 'touch base on'을 사용해 핵심 안건에 진입하세요.";
      } else if (lower.includes("delay") || lower.includes("blocker") || lower.includes("issue") || lower.includes("problem")) {
        correctionData.corrected = "We ran into an unexpected blocker, so pushing to production this Friday would be cutting it close.";
        correctionData.tip = "💡 Coach Tip: 문제 발생 시 'cutting it close' 완곡어조를 사용하여 외교적으로 리스크를 전달하세요.";
      } else if (lower.includes("yes") || lower.includes("sure") || lower.includes("okay")) {
        correctionData.corrected = "Absolutely. To be completely transparent, I will circle back with our team by EOD.";
        correctionData.tip = "💡 Coach Tip: 단순 수락 대신 'circle back with' 및 'by EOD'를 붙여 프로페셔널한 팔로업 약속을 전달하세요.";
      } else if (lower.includes("how about") || lower.includes("what about") || lower.includes("when")) {
        correctionData.corrected = "Could you clarify our position on the QA regression testing timeline?";
        correctionData.tip = "💡 Coach Tip: 질의 시 'clarify our position' 표현을 사용하여 회의의 목표를 명확히 정렬하세요.";
      }

      // 2. Dynamic Context-Aware Roleplay State Engine
      const userTurns = messagesHistory.filter(m => m.sender === 'user').length;
      let reply = "";

      if (userTurns <= 1) {
        if (lower.includes("hello") || lower.includes("hi")) {
          reply = "Good morning! Thanks for joining the call. We need to touch base on the API integration timeline. Where do we currently stand?";
        } else {
          reply = "Thanks for jumping on the call. Before we dive in, can you clarify if we ran into any blockers with legacy authentication?";
        }
      } else if (lower.includes("post") || lower.includes("action") || lower.includes("plan") || lower.includes("yes") || lower.includes("sure")) {
        reply = "Appreciate the update! Pushing back the release by three business days makes total sense to avoid vulnerabilities. Could you circle back with an updated action plan by end of day?";
      } else if (lower.includes("delay") || lower.includes("blocker") || lower.includes("close") || lower.includes("issue")) {
        reply = "I hear you. Releasing this Friday is definitely cutting it close. Is there any workaround we can leverage to meet the client deliverable?";
      } else if (userTurns >= 3) {
        reply = "Sounds like a solid plan. Once you send over the revised roadmap, I'll review it with leadership. Let's touch base again tomorrow morning!";
      } else {
        reply = "That makes sense. Let's align with the QA team as well so we ensure full regression coverage before deployment. Does that work for you?";
      }

      return { reply, correctionData };
    }

          <!-- Main SPEAK Pattern Card -->
          <div class="inzmo-glass-card" style="padding: 36px; text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <span class="inzmo-pill cyan" style="font-size: 0.75rem;">
                📌 출처: ${state.drillSourceMode === 'current' ? (activeArchive ? activeArchive.title : '선택된 녹취록') : (state.drillSourceMode === 'all' ? '전체 아카이브 모음' : '단어장 보관함')}
              </span>
              <span class="inzmo-pill mint">Pattern ${safeIndex + 1} / ${drillList.length}</span>
            </div>
            
            <h1 style="font-size: 2.3rem; color: var(--accent-mint); margin-top: 12px; font-weight: 800;">"${exp.phrase}"</h1>

            <!-- 3. 따라 말하기 연습 문장 박스 (120% 확대 유지) -->
            <div style="margin: 28px 0 24px 0; padding: 28px 24px; border-radius: 18px; background: rgba(13,18,31,0.85); border: 2px solid ${state.isShadowingListening ? 'var(--accent-mint)' : 'var(--border-glass-glow)'}; box-shadow: ${state.isShadowingListening ? 'var(--glow-mint)' : '0 10px 30px rgba(0,0,0,0.5)'}; transition: all 0.3s ease;">
              <span style="font-size: 0.95rem; color: var(--accent-cyan); font-weight: 700; display: block; margin-bottom: 10px; text-transform: uppercase;">
                ${state.isShadowingListening ? '🎙️ 마이크가 활성화되었습니다. 아래 문장을 크게 영어로 읽으세요!' : '🔊 1단계: 원어민 발음 듣기 ➔ 🎙️ 2단계: 따라 말하기'}
              </span>
              <p style="font-size: 1.5rem; color: #FFF; font-style: italic; line-height: 1.55; font-weight: 700;">"${exp.exampleSentence}"</p>
            </div>

            <!-- 4. 버튼 바 -->
            <div style="display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px;">
              <button class="inzmo-btn inzmo-btn-secondary" style="padding: 12px 24px; font-size: 0.95rem;" onclick="prevDrill()">
                ⬅️ 이전 패턴
              </button>
              
              <button class="inzmo-btn inzmo-btn-secondary" style="padding: 12px 24px; font-size: 0.95rem; color: var(--accent-cyan);" onclick="speakText('${exp.exampleSentence.replace(/'/g, "\\'")}')">
                🔊 1. 원어민 발음 듣기
              </button>
              
              ${state.isShadowingListening ? `
                <button class="inzmo-btn" 
                        style="padding: 12px 24px; font-size: 0.95rem; background: linear-gradient(135deg, #FF3366 0%, #FF0044 100%); color: #FFFFFF; font-weight: 700; border-radius: var(--radius-md); box-shadow: 0 4px 15px rgba(255, 0, 68, 0.4);" 
                        onclick="startShadowingSpeech('${exp.exampleSentence.replace(/'/g, "\\'")}')">
                  ■ 섀도잉 녹음 중단
                </button>
              ` : `
                <button class="inzmo-btn inzmo-btn-primary" 
                        style="padding: 12px 24px; font-size: 0.95rem;" 
                        onclick="startShadowingSpeech('${exp.exampleSentence.replace(/'/g, "\\'")}')">
                  🎙️ 2. 따라 말하기 (음성 인식 & 판독)
                </button>
              `}
              
              <button class="inzmo-btn inzmo-btn-secondary" style="padding: 12px 24px; font-size: 0.95rem;" onclick="nextDrill()">
                ➡️ 다음 패턴
              </button>
            </div>

            <!-- SPEAK Interactive Speech Assessment Feedback Panel -->
            ${state.isShadowingListening ? `
              <div class="shadowing-score-box" style="text-align: center; border-color: var(--accent-mint);">
                <div class="pulse-dot" style="margin: 0 auto 10px auto;"></div>
                <strong style="color: var(--accent-mint); font-size: 1.1rem; display: block;">🎙️ 음성 수신 중... 따라 말해보세요!</strong>
                <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 4px;">브라우저 마이크에 대고 위 120% 확대 문장을 발화하시면 AI가 실시간으로 분석합니다.</p>
              </div>
            ` : ''}

            ${state.shadowingScore !== null && !state.isShadowingListening ? `
              <div class="shadowing-score-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                  <span class="inzmo-pill ${state.shadowingScore >= 80 ? 'mint' : (state.shadowingScore >= 50 ? 'cyan' : 'violet')}">
                    🎯 SPEAK AI 발음 분석 리포트
                  </span>
                  <div style="font-size: 1.6rem; font-weight: 800; font-family: var(--font-display); color: ${state.shadowingScore >= 80 ? 'var(--accent-mint)' : (state.shadowingScore >= 50 ? 'var(--accent-cyan)' : '#FF477E')};">
                    ${state.shadowingScore} 점 / 100점
                  </div>
                </div>

                <div style="margin-bottom: 12px; padding: 12px; border-radius: 10px; background: rgba(13,18,31,0.8); font-size: 0.95rem;">
                  <span style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 4px;">👤 인식된 유저 발화 (User Spoken):</span>
                  <strong style="color: #FFF;">"${state.userShadowingSpoken || '(음성 수신 대기 중...)'}"</strong>
                </div>

                <div style="font-size: 0.9rem; color: #FFF; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                  <span>💡 코칭 피드백:</span>
                  <span style="color: ${state.shadowingScore >= 80 ? '#D1FAE5' : '#FFB3C1'};">${state.shadowingFeedback}</span>
                </div>
              </div>
            ` : ''}

          </div>
        </div>
      `;
    }

    function renderVault() {
      return `
        <div>
          <div class="inzmo-glass-card" style="padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
              <h2 style="font-size: 1.4rem; color: #FFF;">📚 나만의 비즈니스 영어 표현 단어장 (${state.savedExpressions.length}개)</h2>
              <p style="font-size: 0.85rem; color: var(--text-muted);">녹취록에서 수집하고 저장한 나만의 관용 표현을 복습하고 관리하세요.</p>
            </div>
            
            <div style="display: flex; gap: 10px;">
              <button class="inzmo-btn inzmo-btn-secondary" onclick="exportJSON()">📥 JSON 내보내기</button>
              <button class="inzmo-btn inzmo-btn-secondary" style="color: #FF758F; border-color: rgba(255,117,143,0.3);" onclick="clearAllSavedExpressions()">
                🗑️ 단어장 전체 비우기
              </button>
            </div>
          </div>

          ${state.savedExpressions.length === 0 ? `
            <div class="inzmo-glass-card" style="padding: 60px; text-align: center;">
              <span style="font-size: 3rem; display: block; margin-bottom: 12px;">📭</span>
              <h3 style="font-size: 1.2rem; color: var(--text-muted);">저장된 표현이 없습니다.</h3>
              <p style="font-size: 0.88rem; color: var(--text-dim); margin-top: 6px;">'녹취록 정제' 메뉴에서 추출된 표현 카드의 [+ 단어장 저장] 버튼을 클릭해 보세요.</p>
              <button class="inzmo-btn inzmo-btn-primary" style="margin-top: 20px;" onclick="setTab('analyzer')">📁 녹취록 정제 메뉴로 이동</button>
            </div>
          ` : `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
              ${state.savedExpressions.map((exp, idx) => `
                <div class="inzmo-glass-card interactive" style="padding: 24px; display: flex; flex-direction: column; justify-content: space-between;">
                  <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                      <span class="inzmo-pill cyan" style="font-size: 0.72rem;">${exp.category}</span>
                      <button style="background: transparent; border: none; color: #FF758F; font-size: 0.8rem; cursor: pointer; padding: 2px 6px;" onclick="removeSavedExpression(${idx})" title="단어장에서 삭제">
                        🗑️ 삭제
                      </button>
                    </div>

                    <h3 style="color: var(--accent-mint); font-size: 1.25rem; font-weight: 700;">"${exp.phrase}"</h3>
                    
                    <div style="font-size: 0.88rem; color: #FFF; font-weight: 600; margin-top: 4px;">
                      🇰🇷 ${cleanKoreanMeaning(exp.nativePolish || exp.directKorean)}
                    </div>

                    <div style="margin-top: 12px; padding: 12px; border-radius: 10px; background: rgba(13,18,31,0.7); font-size: 0.85rem; color: var(--text-muted);">
                      "${exp.exampleSentence}"
                    </div>
                  </div>

                  <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button class="inzmo-btn inzmo-btn-secondary" style="flex: 1; padding: 8px; font-size: 0.82rem;" onclick="speakText('${exp.exampleSentence.replace(/'/g, "\\'")}')">
                      🔊 발음 듣기
                    </button>
                    <button class="inzmo-btn inzmo-btn-secondary" style="padding: 8px 12px; font-size: 0.82rem; color: #FF758F; border-color: rgba(255,117,143,0.3);" onclick="removeSavedExpression(${idx})">
                      삭제
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderModal() {
      return `
        <div class="modal-backdrop">
          <div class="inzmo-glass-card" style="width: 100%; max-width: 520px; padding: 32px; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 18px; right: 20px; background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.2rem;">✕</button>

            <h3 style="font-size: 1.25rem; color: #FFF; margin-bottom: 8px;">⚙️ OpenAI Realtime API Key 설정</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
              OpenAI API 키를 입력하시면 공식 GPT-4o Realtime 초저지연 음성 대화 연동 모드로 전환됩니다.
            </p>

            <div style="margin-bottom: 20px;">
              <label style="display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px;">OpenAI Key (sk-...)</label>
              <input id="modalKeyInput" type="password" class="inzmo-input" placeholder="sk-proj-..." value="${state.apiKey}" />
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="inzmo-btn inzmo-btn-secondary" style="flex: 1;" onclick="closeModal()">취소</button>
              <button class="inzmo-btn inzmo-btn-primary" style="flex: 1;" onclick="saveApiKey()">저장하기</button>
            </div>
          </div>
        </div>
      `;
    }

    // Drag & Drop File Handlers
    window.handleDragOver = function(e) {
      e.preventDefault();
      const dropzone = document.getElementById('dropzoneBox');
      if (dropzone) dropzone.classList.add('drag-active');
    };

    window.handleDragLeave = function(e) {
      e.preventDefault();
      const dropzone = document.getElementById('dropzoneBox');
      if (dropzone) dropzone.classList.remove('drag-active');
    };

    window.handleDrop = function(e) {
      e.preventDefault();
      const dropzone = document.getElementById('dropzoneBox');
      if (dropzone) dropzone.classList.remove('drag-active');

      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        readFileContent(file);
      }
    };

    window.handleFileUpload = function(event) {
      const file = event.target.files[0];
      if (file) readFileContent(file);
    };

    function readFileContent(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        state.customText = e.target.result;
        state.customTitle = file.name.replace(/\.[^/.]+$/, "");
        const textarea = document.getElementById('customTextarea');
        if (textarea) textarea.value = state.customText;
        showToast(`📄 "${file.name}" 파일 드래그 & 드롭 업로드 완료!`);
        renderApp();
      };
      reader.readAsText(file);
    }

    // SPEAK Pattern Drill Speech Recognition & Scoring Handler
    window.startShadowingSpeech = function(targetSentence) {
      if (state.isShadowingListening) {
        if (recognition) recognition.stop();
        state.isShadowingListening = false;
        renderApp();
        return;
      }

      if (!recognition) {
        showToast("현재 브라우저는 음성 인식을 지원하지 않습니다.");
        return;
      }

      state.isShadowingListening = true;
      state.userShadowingSpoken = '';
      state.shadowingScore = null;
      renderApp();

      recognition.start();

      recognition.onresult = (e) => {
        const spokenText = e.results[0][0].transcript;
        state.userShadowingSpoken = spokenText;
        const evalResult = evaluateShadowingSpeech(spokenText, targetSentence);
        state.shadowingScore = evalResult.score;
        state.shadowingFeedback = evalResult.feedback;
        state.isShadowingListening = false;
        showToast(`🎯 섀도잉 인식 완료! 점수: ${evalResult.score}점`);
        renderApp();
      };

      recognition.onerror = () => {
        state.isShadowingListening = false;
        showToast("음성 인식에 실패했습니다. 마이크 권한을 확인해 주세요.");
        renderApp();
      };

      recognition.onend = () => {
        state.isShadowingListening = false;
        renderApp();
      };
    };

    // Handlers
    window.setTab = function(tab) { state.activeTab = tab; renderApp(); };
    window.openModal = function() { state.isModalOpen = true; renderApp(); };
    window.closeModal = function() { state.isModalOpen = false; renderApp(); };

    window.setDrillSourceMode = function(mode) {
      state.drillSourceMode = mode;
      state.drillIndex = 0;
      state.shadowingScore = null;
      renderApp();
    };

    window.nextDrill = function() {
      const list = getDrillExpressionList();
      state.drillIndex = (state.drillIndex + 1) % list.length;
      state.shadowingScore = null;
      renderApp();
    };

    window.prevDrill = function() {
      const list = getDrillExpressionList();
      state.drillIndex = (state.drillIndex - 1 + list.length) % list.length;
      state.shadowingScore = null;
      renderApp();
    };

    window.removeSavedExpression = function(idx) {
      const target = state.savedExpressions[idx];
      if (target) {
        state.savedExpressions.splice(idx, 1);
        saveState();
        showToast(`🗑️ "${target.phrase}" 표현이 단어장에서 삭제되었습니다.`);
        renderApp();
      }
    };

    window.clearAllSavedExpressions = function() {
      if (confirm("단어장에 저장된 모든 표현을 비우시겠습니까?")) {
        state.savedExpressions = [];
        saveState();
        showToast("🗑️ 단어장이 비워졌습니다.");
        renderApp();
      }
    };

    window.loadSampleText = function() {
      state.customText = DEFAULT_PRESET.rawContent;
      state.customTitle = DEFAULT_PRESET.title;
      showToast("💡 샘플 컨콜 녹취록이 로드되었습니다.");
      renderApp();
    };

    window.runCustomAnalysis = function() {
      const textarea = document.getElementById('customTextarea');
      const text = (textarea ? textarea.value : state.customText) || state.customText;

      if (!text || !text.trim()) {
        showToast("녹취록 텍스트를 입력하거나 파일을 첨부해 주세요.");
        return;
      }

      state.customText = text;
      const title = state.customTitle || `Concall Transcript (${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})})`;
      const expressions = extractExpressionsFromCustomText(text);

      const newArchive = {
        id: `arch-${Date.now()}`,
        title: title,
        date: new Date().toISOString().replace('T', ' ').slice(0, 16),
        rawContent: text,
        extractedExpressions: expressions
      };

      state.archivedTranscripts.unshift(newArchive);
      state.activeArchiveId = newArchive.id;
      state.currentExpressions = expressions;

      saveArchivesToStorage();
      showToast(`✨ "${title}" 녹취록이 지속 아카이브에 저장되고 ${expressions.length}개 표현이 정제되었습니다!`);
      renderApp();
    };

    window.selectArchive = function(id) {
      const found = state.archivedTranscripts.find(a => a.id === id);
      if (found) {
        state.activeArchiveId = found.id;
        state.customTitle = found.title;
        state.customText = found.rawContent;
        state.currentExpressions = found.extractedExpressions || extractExpressionsFromCustomText(found.rawContent);
        showToast(`📚 아카이브 "${found.title}" 로드 완료`);
        renderApp();
      }
    };

    window.deleteArchive = function(id) {
      state.archivedTranscripts = state.archivedTranscripts.filter(a => a.id !== id);
      if (state.activeArchiveId === id) {
        state.activeArchiveId = state.archivedTranscripts[0] ? state.archivedTranscripts[0].id : null;
        if (state.archivedTranscripts[0]) {
          state.currentExpressions = state.archivedTranscripts[0].extractedExpressions;
        }
      }
      saveArchivesToStorage();
      showToast("아카이브에서 삭제되었습니다.");
      renderApp();
    };

    window.saveApiKey = function() {
      const input = document.getElementById('modalKeyInput');
      if (input) {
        state.apiKey = input.value.trim();
        localStorage.setItem('bizspeak_api_key', state.apiKey);
        showToast(state.apiKey ? "⚡ OpenAI Live Realtime API 연동 모드 저장 완료!" : "🟢 무료 브라우저 하이브리드 모드로 전환됨");
      }
      state.isModalOpen = false;
      renderApp();
    };

    window.toggleSave = function(idx) {
      const exp = state.currentExpressions[idx];
      const foundIdx = state.savedExpressions.findIndex(s => s.phrase === exp.phrase);
      if (foundIdx >= 0) {
        state.savedExpressions.splice(foundIdx, 1);
        showToast(`"${exp.phrase}" 단어장에서 제거됨`);
      } else {
        state.savedExpressions.unshift(exp);
        showToast(`✨ "${exp.phrase}" 단어장에 저장 완료!`);
      }
      saveState();
      renderApp();
    };

    window.toggleMic = function() {
      if (state.isRecording) {
        if (recognition) recognition.stop();
        state.isRecording = false;
        renderApp();
      } else {
        if (!recognition) {
          showToast("현재 브라우저는 마이크 음성 인식을 지원하지 않습니다.");
          return;
        }
        state.isRecording = true;
        renderApp();
        recognition.start();
        recognition.onresult = (e) => {
          const text = e.results[0][0].transcript;
          const input = document.getElementById('chatInput');
          if (input) input.value = text;
          state.isRecording = false;
          renderApp();
          sendMessage();
        };
        recognition.onend = () => { state.isRecording = false; renderApp(); };
      }
    };

    window.sendMessage = async function() {
      const input = document.getElementById('chatInput');
      if (!input || !input.value.trim()) return;
      const userText = input.value.trim();

      state.messages.push({ id: Date.now(), sender: 'user', text: userText });
      input.value = '';
      renderApp();
      scrollToChatBottom();

      let aiReply = "";
      let coachData = null;

      if (state.apiKey && state.apiKey.startsWith("sk-")) {
        try {
          const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${state.apiKey}`
            },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: [
                { role: "system", content: "You are David, a senior US Software Architect on a project concall with a Korean PM. Keep replies concise (1-2 sentences), professional, and natural business English." },
                ...state.messages.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
              ]
            })
          });
          const data = await response.json();
          if (data.choices && data.choices[0]) {
            aiReply = data.choices[0].message.content;
          }
        } catch (err) {
          console.error(err);
        }
      }

      if (!aiReply) {
        const smart = generateSmartAiResponse(userText, state.messages);
        aiReply = smart.reply;
        coachData = smart.correctionData;
      } else {
        coachData = generateSmartAiResponse(userText, state.messages).correctionData;
      }

      state.currentCoachReport = coachData;
      state.messages.push({ id: Date.now() + 1, sender: 'ai', text: aiReply });
      state.isAiSpeaking = true;
      renderApp();
      scrollToChatBottom();

      speakText(aiReply, () => {
        state.isAiSpeaking = false;
        renderApp();
      });
    };

    function scrollToChatBottom() {
      setTimeout(() => {
        const list = document.getElementById('chatMessageList');
        if (list) list.scrollTop = list.scrollHeight;
      }, 50);
    }

    window.exportJSON = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.savedExpressions, null, 2));
      const a = document.createElement('a'); a.href = dataStr;
      a.download = `BizSpeak_Expressions_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };

    window.addEventListener('DOMContentLoaded', () => renderApp());
    if (document.readyState === 'complete' || document.readyState === 'interactive') renderApp();
  </script>
</body>
</html>
